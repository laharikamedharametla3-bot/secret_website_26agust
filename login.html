<!DOCTYPE html>
<html>
<head>
<title>Welcome </title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
    font-family:Segoe UI;
}

.box{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(243, 132, 132, 0.2);
    width:320px;
}

h1{
    color:#ff4d6d;
}

input{
    width: 100%;
    padding: 10px;
    margin:10px;
    border-radius:10px;
    border: 5px;
}

button{
    width: 95%;
    padding: 9px;
    background:#ff4d6d;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff1f4b;
}
</style>
</head>

<body>

<div class="box">
    <h1>❤️ Happy Birthday Love ❤️</h1>

    <input type="text" id="username" placeholder="Your Name">

    <input type="password" id="password" placeholder="Birthday Secret">

    <button onclick="login()">Enter Surprise</button>
</div>

<script>
function login(){
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user=="charan" && pass=="26291008"){
        window.location.href="home.html";
    }
    else{
        alert("Wrong Secret Code ❤️");
    }
}
</script>

</body>
</html>
